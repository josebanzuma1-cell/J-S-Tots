<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Illustration of children playing in front of the J and S Tots Pre-School building">
  <title>Children playing outside J &amp; S Tots Pre-School</title>
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeec6"/>
      <stop offset="0.5" stop-color="#ffdcab"/>
      <stop offset="1" stop-color="#f9c891"/>
