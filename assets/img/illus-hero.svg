      <path d="M685 486c0-24 16-38 36-38s36 14 36 38c-8-14-20-18-36-18s-28 4-36 18Z" fill="#4a2c17"/>
      <circle cx="710" cy="490" r="4" fill="#3b2217"/>
      <circle cx="734" cy="490" r="4" fill="#3b2217"/>
      <path d="M712 505c5 6 15 6 20 0" stroke="#3b2217" stroke-width="3.8" stroke-linecap="round" fill="none"/>
