      <rect x="268" y="298" width="9" height="44" rx="4.5" fill="#8a6a4e"/>
      <path d="M277 302h46l-13 14 13 14h-46Z" fill="#f2a71b"/>
      <rect x="248" y="476" width="60" height="108" rx="30" fill="#24386f"/>
      <circle cx="294" cy="532" r="4.5" fill="#ffd166"/>
      <rect x="186" y="430" width="56" height="52" rx="12" fill="#aec7ec" stroke="#fff8ec" stroke-width="5"/>
      <rect x="320" y="430" width="56" height="52" rx="12" fill="#aec7ec" stroke="#fff8ec" stroke-width="5"/>
      <rect x="186" y="508" width="48" height="44" rx="11" fill="#aec7ec" stroke="#fff8ec" stroke-width="5"/>
