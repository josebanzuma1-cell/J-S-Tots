<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="A child sitting with an open story book">
  <title>Story time</title>
  <rect width="800" height="600" fill="#e6ddf6"/>
  <circle cx="400" cy="280" r="198" fill="#d9ccf0"/>
  <path d="M0 468c160-30 240 22 400 0s240-28 400 4v128H0Z" fill="#c3b2e6"/>

  <!-- floating letters -->
  <g font-family="Quicksand, Trebuchet MS, sans-serif" font-weight="700" fill="#6f55b0" opacity="0.65">
    <text x="128" y="190" font-size="62">A</text>
    <text x="640" y="162" font-size="52">B</text>
    <text x="684" y="266" font-size="40">C</text>
    <text x="104" y="300" font-size="38">1</text>
  </g>

  <!-- child seated -->
  <g>
    <path d="M296 452h208" stroke="#8a5a3b" stroke-width="30" stroke-linecap="round"/>
    <rect x="334" y="300" width="94" height="128" rx="34" fill="#f2a71b"/>
    <circle cx="381" cy="240" r="48" fill="#c98a5e"/>
    <path d="M333 236c0-30 21-50 48-50s48 20 48 50c-10-20-25-26-48-26s-38 6-48 26Z" fill="#4a2c17"/>
    <circle cx="365" cy="244" r="5.2" fill="#3b2217"/>
    <circle cx="397" cy="244" r="5.2" fill="#3b2217"/>
    <path d="M367 264c7 9 20 9 27 0" stroke="#3b2217" stroke-width="4.8" stroke-linecap="round" fill="none"/>
    <path d="M340 342l-32 52M424 342l32 52" stroke="#c98a5e" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- open book -->
  <g>
    <path d="M286 390c42-18 78-14 96 6 18-20 54-24 96-6l-12 78c-40-16-72-12-84 4-12-16-44-20-84-4Z"
          fill="#fff8ec" stroke="#6f55b0" stroke-width="7" stroke-linejoin="round"/>
    <path d="M382 396v82" stroke="#6f55b0" stroke-width="7"/>
    <path d="M312 418h44M312 440h36M408 418h44M408 440h36" stroke="#c3b2e6" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
